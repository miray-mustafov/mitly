[project]
name = "mitly"
version = "0.1.0"
requires-python = "==3.13.7"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version = "0.0.1"
update_changelog_on_bump = true
major_version_zero = true
